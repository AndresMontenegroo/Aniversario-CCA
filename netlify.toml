[build]
  publish = "."

# Proxy del front a tu Apps Script (preserva la query ?p=...)
[[redirects]]
  from = "/api"
  to = "https://script.google.com/macros/s/AKfycbyM-43GmY3A9NZFx0OlGYNQLaNgRA90pMTqgRbN13IIapEmfIVn2t2r1whR3yGOZUPuRQ/exec"
  status = 200
  force = true

# (Opcional) Cache básico para archivos estáticos
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


   